name: Deploy Demo to Mac Mini

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed, or if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Build WASM packages
      - name: Build WASM (web target)
        run: wasm-pack build --target web --out-dir pkg

      - name: Build WASM (node target)
        run: wasm-pack build --target nodejs --out-dir pkg-node

      # Build TypeScript library
      - name: Install root dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      # Build demo site
      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo site
        working-directory: demo
        run: npm run build

      # Package and deploy to Mac Mini via webhook
      - name: Create deploy tarball
        working-directory: demo/dist
        run: tar czf ../../demo-dist.tar.gz .

      - name: Deploy to Mac Mini
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/deploy-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @demo-dist.tar.gz \
            https://anki-renderer.bjblabs.com/_deploy)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/deploy-response.txt
          echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Deploy failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Verify deployment
        run: |
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anki-renderer.bjblabs.com/)
          echo "Site status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Site not responding after deploy"
            exit 1
          fi
